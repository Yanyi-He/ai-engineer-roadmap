      "vars": {
        "case_id": "returns"
      }
    },
    {
      "vars": {
        "case_id": "refund"
      }
    },
    {
      "vars": {
        "case_id": "unanswerable"
      }
    },
    {
      "vars": {
        "case_id": "tenant"
      }
    },
    {
      "vars": {
        "case_id": "revision"
      }
    },
    {
      "vars": {
        "case_id": "tracking"
      }
    }
  ]
