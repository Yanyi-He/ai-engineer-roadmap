name: Application evaluation reference
on: [push, pull_request]
jobs:
  evaluation:
    runs-on: ubuntu-latest
    env:
      RAGAS_DO_NOT_TRACK: 'true'
      PROMPTFOO_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r examples/evaluation/requirements.txt
      - run: python -B -m unittest discover -s tests -v
      - run: python -B -m pytest -q examples/evaluation/test_ragas_reference.py
      - run: python -B -m labs.evaluation.regression --output artifacts/regression.json
      - run: python -B -m labs.evaluation.ragas_eval --output artifacts/ragas-id.json
      - run: npm install --prefix examples/evaluation
      - run: examples/evaluation/node_modules/.bin/promptfoo eval -c labs/evaluation/promptfooconfig.yaml -o artifacts/promptfoo.json --no-cache
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-results
          path: artifacts/
